const bytes = new Uint8Array(pdfData.length);
for (let i=0; i<pdfData.length; i++) bytes[i] = pdfData.charCodeAt(i);
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdf = null, current = 1, scale = 1.0, rendering = false;
const pagesEl = document.getElementById("pages");
const statusEl = document.getElementById("status");
const pageInfo = document.getElementById("pageInfo");
const zoomInfo = document.getElementById("zoomInfo");
const prev = document.getElementById("prev"), next = document.getElementById("next");

function updateControls() {
  pageInfo.textContent = `${current} / ${pdf.numPages} 페이지`;
  zoomInfo.textContent = `${Math.round(scale*100)}%`;
  prev.disabled = current <= 1;
  next.disabled = current >= pdf.numPages;
}
async function renderPage(n) {
  if (rendering) return;
  rendering = true;
  current = n;
  statusEl.textContent = "페이지를 표시하고 있습니다…";
  pagesEl.innerHTML = "";
  try {
    const page = await pdf.getPage(n);
    const viewport = page.getViewport({scale});
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", {alpha:false});
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(viewport.width*dpr);
    canvas.height = Math.floor(viewport.height*dpr);
    canvas.style.width = `${viewport.width}px`;
    canvas.style.height = `${viewport.height}px`;
    const wrap = document.createElement("div");
    wrap.className = "page-wrap";
    wrap.appendChild(canvas);
    pagesEl.appendChild(wrap);
    await page.render({canvasContext:ctx, viewport, transform:dpr===1?null:[dpr,0,0,dpr,0,0]}).promise;
    statusEl.textContent = "";
    updateControls();
  } catch(e) {
    statusEl.textContent = "페이지를 표시하지 못했습니다: " + e.message;
  } finally { rendering = false; }
}
document.getElementById("prev").onclick = () => { if(current>1) renderPage(current-1); };
document.getElementById("next").onclick = () => { if(current<pdf.numPages) renderPage(current+1); };
document.getElementById("plus").onclick = () => { scale=Math.min(2.5,scale+0.15); renderPage(current); };
document.getElementById("minus").onclick = () => { scale=Math.max(0.5,scale-0.15); renderPage(current); };
document.getElementById("fit").onclick = async () => {
  const page = await pdf.getPage(current);
  const base = page.getViewport({scale:1});
  const available = Math.max(280, Math.min(window.innerWidth-28, 1100));
  scale = available/base.width;
  renderPage(current);
};
document.getElementById("download").onclick = () => {
  const blob = new Blob([bytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="2027_학과안내서.pdf"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
pdfjsLib.getDocument({data:bytes}).promise.then(async doc => {
  pdf=doc;
  statusEl.textContent="";
  updateControls();
  const page = await pdf.getPage(1);
  const base = page.getViewport({scale:1});
  scale = Math.min(1.15, (window.innerWidth-28)/base.width);
  renderPage(1);
}).catch(err => {
  statusEl.textContent = "PDF를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요. ("+err.message+")";
});
